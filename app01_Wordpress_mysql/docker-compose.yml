# Explicit project name: Compose otherwise derives one from the directory
# basename, which collides with any other checkout that happens to have a
# same-named subdirectory (this bit us with an unrelated repo that also has
# an "app01_Wordpress_mysql" folder — same derived project name meant we
# briefly shared Docker networks *and* named volumes with it).
name: quantumai-wp

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    # PLAN.md Phase 5 "Server Hardening" — the closest container-native
    # equivalent to host-level SELinux/AppArmor MAC for a docker-compose
    # stack (see README "Deployment & hardening" for the fuller picture).
    # Blocks a process from gaining privileges beyond what it starts with
    # (e.g. via a setuid binary), even if the container itself is fully
    # compromised. Confirmed safe on every service in this file by actually
    # restarting each one and re-running its normal workflow — none of them
    # rely on privilege escalation during regular operation.
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      WP_DB_USER: ${WP_DB_USER:?set WP_DB_USER in .env}
      WP_DB_PASSWORD: ${WP_DB_PASSWORD:?set WP_DB_PASSWORD in .env}
      # Read by db/init/02-create-backup-user.sh (PLAN.md Phase 6).
      BACKUP_DB_USER: ${BACKUP_DB_USER:?set BACKUP_DB_USER in .env}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD in .env}
      # Read by db/init/03-create-restore-user.sh (PLAN.md Phase 6) — see
      # that script's doc comment for why restoring can't reuse WP_DB_USER.
      RESTORE_DB_USER: ${RESTORE_DB_USER:?set RESTORE_DB_USER in .env}
      RESTORE_DB_PASSWORD: ${RESTORE_DB_PASSWORD:?set RESTORE_DB_PASSWORD in .env}
    # Require TLS for all client connections (SR-03 / PLAN Phase 2 "Encrypted database
    # connections"). MySQL 8 auto-generates a self-signed CA/cert/key in the data
    # directory on first boot if none are supplied.
    command: --require-secure-transport=ON
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE}
      WORDPRESS_DB_USER: ${WP_DB_USER}
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: ${WP_TABLE_PREFIX:-wp_}
      WP_LOGIN_SLUG: ${WP_LOGIN_SLUG:-portal-access}
      WORDPRESS_AUTH_KEY: ${WORDPRESS_AUTH_KEY}
      WORDPRESS_SECURE_AUTH_KEY: ${WORDPRESS_SECURE_AUTH_KEY}
      WORDPRESS_LOGGED_IN_KEY: ${WORDPRESS_LOGGED_IN_KEY}
      WORDPRESS_NONCE_KEY: ${WORDPRESS_NONCE_KEY}
      WORDPRESS_AUTH_SALT: ${WORDPRESS_AUTH_SALT}
      WORDPRESS_SECURE_AUTH_SALT: ${WORDPRESS_SECURE_AUTH_SALT}
      WORDPRESS_LOGGED_IN_SALT: ${WORDPRESS_LOGGED_IN_SALT}
      WORDPRESS_NONCE_SALT: ${WORDPRESS_NONCE_SALT}
      # SR-04 / AS-03 mitigations: no in-browser file editing, force encrypted DB
      # connection. (XML-RPC is disabled via the mu-plugin below, not here —
      # add_filter() isn't defined yet when this block is evaluated.)
      WORDPRESS_CONFIG_EXTRA: |
        define('DISALLOW_FILE_EDIT', true);
        define('WP_AUTO_UPDATE_CORE', 'minor');
        define('MYSQL_CLIENT_FLAGS', MYSQLI_CLIENT_SSL);
        define('QUANTUMAI_LOGIN_SLUG', getenv('WP_LOGIN_SLUG'));
        // SR-03: nginx (the sole entry point reachable on the `web` network)
        // terminates TLS and proxies to us over plain HTTP, setting
        // X-Forwarded-Proto to whatever scheme the client actually used.
        // WordPress doesn't trust that header on its own, so without this,
        // is_ssl() always sees "http" here and FORCE_SSL_ADMIN below would
        // just redirect-loop. Must live in wp-config.php itself (mu-plugins
        // load too late — after core has already used is_ssl() for cookie
        // setup during wp-settings.php's own bootstrap).
        if ( ! empty( $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) && 'https' === $$_SERVER['HTTP_X_FORWARDED_PROTO'] ) {
            $$_SERVER['HTTPS'] = 'on';
        }
        define('FORCE_SSL_ADMIN', true);
    # PLAN.md Phase 5 "wp-config.php secured at 400 or 440, owned by the web
    # user" — the stock image leaves it 644. See the wrapper script's own
    # comment for how/why it's a two-pass call into the image's own
    # entrypoint rather than a fork of it.
    #
    # command is required here, not just entrypoint: overriding entrypoint
    # in Compose clears the image's own default CMD ("apache2-foreground")
    # unless it's respecified — confirmed by actually running this without
    # it, which produced a container that exited immediately with code 0
    # and looped restarting, since the wrapper's own `exec ... "$@"` had
    # nothing to exec.
    entrypoint: ["/wp-hardening/docker-entrypoint-wrapper.sh"]
    command: ["apache2-foreground"]
    volumes:
      - wp_data:/var/www/html
      - ./wp-php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./wp-php/docker-entrypoint-wrapper.sh:/wp-hardening/docker-entrypoint-wrapper.sh:ro
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./wp-content/themes/quantumai-theme:/var/www/html/wp-content/themes/quantumai-theme:ro
    networks:
      - internal
      - web

  # AS-03 WAF: reverse proxy + TLS termination + ModSecurity/OWASP CRS, in
  # place of plain nginx:alpine. Runs as an unprivileged user (image
  # constraint), so it listens on 8080/8443 *inside* the container regardless
  # of what's published on the host — see PORT/SSL_PORT below.
  nginx:
    image: owasp/modsecurity-crs:nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - wordpress
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      BACKEND: http://wordpress:80
      PORT: 8080
      SSL_PORT: 8443
      # SR-03: unchanged from the pre-WAF setup — TLS 1.3 only, always
      # redirect plain HTTP to HTTPS.
      SSL_PROTOCOLS: TLSv1.3
      NGINX_ALWAYS_TLS_REDIRECT: "on"
      # CRS tuning: PARANOIA 1 is CRS's own recommended starting point (low
      # false-positive rate); MODSEC_RULE_ENGINE On means it actually blocks,
      # not just logs, satisfying AS-03's "block common exploit payloads" —
      # not merely observe them. If a real admin workflow ever gets a false
      # positive, the fix is a scoped exclusion in nginx/waf/, not raising
      # these thresholds.
      BLOCKING_PARANOIA: 1
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 4
      MODSEC_RULE_ENGINE: "On"
      # PLAN.md Phase 5 Fail2Ban: the image's own default ACCESSLOG is a
      # symlink to /dev/stdout (confirmed by exec'ing into the container),
      # which only a container-log reader (docker logs / the json-file log
      # driver) can consume — not a real file a host-level Fail2Ban process
      # can tail. Point it at a real bind-mounted path instead so
      # security/fail2ban/ (see README) has something to read.
      ACCESSLOG: /var/log/quantumai/access.log
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx/waf/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./nginx/waf/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
      - ./nginx/waf/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/RESPONSE-999-EXCLUSION-RULES-AFTER-CRS.conf:ro
      # Persists the self-signed cert this image generates on first boot
      # (same "generate one if none exists" behavior our own SR-03 script
      # used to do by hand — this image does it natively, so that script is
      # gone) so it survives container recreation instead of re-prompting a
      # browser cert warning every restart.
      - ./nginx/certs:/etc/nginx/conf
      - wp_data:/var/www/html:ro
      - nginx_cache:/var/cache/nginx
      - ./nginx/logs:/var/log/quantumai
    networks:
      - web

  # AS-03 "automate weekly DAST scans (WPScan)". Not started by a plain
  # `docker compose up` — the "scan" profile means it only runs on demand:
  #   docker compose --profile scan run --rm wpscan
  # See README "Vulnerability scanning (AS-03)" for the weekly-cadence setup.
  wpscan:
    image: wpscanteam/wpscan:latest
    profiles: ["scan"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      - nginx
    environment:
      WPSCAN_API_TOKEN: ${WPSCAN_API_TOKEN:-}
    entrypoint: ["/bin/sh", "/security/run-wpscan.sh"]
    volumes:
      - ./security/run-wpscan.sh:/security/run-wpscan.sh:ro
      - ./security-reports:/report
    networks:
      - web

  # PLAN.md Phase 4 SAST: PHPCS + WordPress Coding Standards, scoped to
  # mu-plugins/ and the theme (see phpcs.xml.dist). Opt-in, same as wpscan:
  #   docker compose --profile sast run --rm phpcs
  phpcs:
    image: composer:2
    profiles: ["sast"]
    security_opt:
      - no-new-privileges:true
    working_dir: /app
    volumes:
      - ./composer.json:/app/composer.json:ro
      - ./composer.lock:/app/composer.lock:ro
      - ./phpcs.xml.dist:/app/phpcs.xml.dist:ro
      - ./vendor:/app/vendor
      - ./mu-plugins:/app/mu-plugins:ro
      - ./wp-content/themes/quantumai-theme:/app/wp-content/themes/quantumai-theme:ro
    entrypoint: ["/bin/sh", "-c"]
    # A single-element list, not a plain string: Compose shlex-splits a plain
    # string command on whitespace before handing it to the entrypoint,
    # which silently truncated everything after "&&" here (learned by
    # actually running this — `docker compose config` showed the command
    # list ending at "--quiet", with "&& vendor/bin/phpcs" dropped entirely).
    command: ["composer install --no-interaction --no-progress --quiet && vendor/bin/phpcs"]

  # PLAN.md Phase 6 "Daily ... full database/file backups securely stored
  # in an off-site, immutable storage (S3 with object lock)". Opt-in, same
  # as wpscan/phpcs — not started by a plain `docker compose up`:
  #   docker compose --profile backup run --rm backup
  # Scope: full backups only, daily (no true incremental); S3 upload is
  # best-effort and skipped gracefully if unconfigured. See README
  # "Backups" for the restore procedure and the full list of known gaps
  # (this hasn't been run against a real S3 bucket from this environment).
  backup:
    image: alpine:3.20
    profiles: ["backup"]
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup/run-backup.sh"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      BACKUP_DB_USER: ${BACKUP_DB_USER:?set BACKUP_DB_USER in .env}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:?set BACKUP_DB_PASSWORD in .env}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?set BACKUP_AGE_RECIPIENT in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Read by backup/restore.sh as its default restore user (only used
      # when the entrypoint is overridden to run a manual restore, never by
      # a plain `docker compose --profile backup run --rm backup`).
      RESTORE_DB_USER: ${RESTORE_DB_USER:?set RESTORE_DB_USER in .env}
      RESTORE_DB_PASSWORD: ${RESTORE_DB_PASSWORD:?set RESTORE_DB_PASSWORD in .env}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-quantumai-wp}
    volumes:
      - ./backup/run-backup.sh:/backup/run-backup.sh:ro
      - ./backup/restore.sh:/backup/restore.sh:ro
      - wp_data:/var/www/html:ro
      - ./backups:/backups
    networks:
      - internal
      - web

networks:
  # DB <-> WordPress only. Marked internal so the database is unreachable from the
  # host or the public internet, and has no outbound route either (least privilege).
  internal:
    internal: true
  # WordPress <-> nginx. Not internal, so WordPress still has outbound internet
  # access for core/plugin update checks, and nginx can publish a host port.
  web:

volumes:
  db_data:
  wp_data:
  nginx_cache:
