# AS-03 WAF (ModSecurity/CRS) request-side exclusions, evaluated before the
# core rule set runs. Mounted at
# /etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
# — this is the CRS project's own supported extension point, not a QuantumAI
# invention (see https://github.com/coreruleset/modsecurity-crs-docker's
# sample docker-compose.yaml).
#
# Deliberately empty: at BLOCKING_PARANOIA=1 (this stack's setting), nothing
# has actually been observed tripping a false positive. Verified directly
# against the running stack, not assumed: the homepage, wp-json/ and
# wp-json/wp/v2/posts, a real wp-login.php-shaped POST (username/password/
# wp-submit/redirect_to/testcookie fields), and — the case this platform
# actually worried about — bra-ket notation ("|0> + |1>", "<bra|ket>") and
# inline LaTeX ("\(E=mc^2\)") in a query string all passed with 200/expected
# codes. Meanwhile a real SQLi payload, a `<script>` XSS payload, and a
# sqlmap User-Agent all correctly got a 403.
#
# Don't pre-emptively add exclusions for problems that haven't been
# confirmed. If a real admin/editor workflow does get blocked later, add a
# targeted SecRuleUpdateTargetById/ctl:ruleRemoveById rule here, scoped as
# narrowly as possible (by REQUEST_URI, not blanket) — check
# `docker compose logs nginx` for the ModSecurity audit log entry first, it
# names the exact rule ID that fired.
