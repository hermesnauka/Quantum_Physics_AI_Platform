# PLAN.md Phase 5 "Server Hardening: ... Fail2Ban". Host-level config, not
# containerized — Fail2Ban needs to run outside Docker to touch the host
# firewall (iptables/nftables), and its own docs recommend against giving a
# container that level of host access. Install with (paths below assume
# Debian/Ubuntu; adjust for your distro):
#
#   sudo cp quantumai-nginx.conf /etc/fail2ban/filter.d/
#   sudo cp jail.local /etc/fail2ban/jail.d/quantumai.local
#   sudo systemctl restart fail2ban
#   sudo fail2ban-client status quantumai-nginx   # confirm the jail is active
#
# This complements, not replaces, the app-layer controls already in this
# repo — see mu-plugins/brute-force-protection.php's own doc comment. The
# two aren't solving the same problem: a wrong WordPress password gets a
# 200 response with an in-page error message, not a 401/403/404, so this
# access-log-based filter genuinely can't see individual login failures —
# that signal only exists at the application layer, which
# brute-force-protection.php (per-IP/per-username lockout) and the audit
# log (mu-plugins/audit-log/, real login_failed events) already cover. What
# THIS filter catches instead: repeated WAF blocks (ModSecurity/CRS 403s —
# SQLi/XSS payloads, scanner User-Agents, etc.) and repeated probes for the
# real (hidden) /wp-login.php or /wp-admin/* while logged out, which
# hide-login.php answers with a plain 404 — see that mu-plugin's own doc
# comment for why. A legitimate visitor never generates either of these on
# this stack under normal use; only a scanner or attacker does.
#
# Deliberately does NOT match on a bare 404 — that would also catch a real
# visitor hitting a stale/mistyped/deleted-post URL, and banning readers of
# an educational site over a dead link is a worse failure mode than missing
# some scanning activity. 404 matching here is scoped to exactly the two
# paths hide-login.php is known to 404 on.
#
# Verified the regex itself against real captured log lines from this
# stack (a legit 200, a WAF-blocked XSS payload, a scanner probing the real
# wp-login.php/wp-admin/, a legitimate admin-ajax.php POST, and a
# legitimate deleted-page 404) — not assumed from the pattern alone. Not
# verified against a real, running Fail2Ban process (no host-level Fail2Ban
# available in this environment) — confirm with `fail2ban-regex` against a
# live nginx/logs/access.log before trusting it unattended:
#
#   fail2ban-regex nginx/logs/access.log quantumai-nginx.conf

[Definition]
failregex = ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ \S+ HTTP/\d\.\d" 403
            ^<HOST> \S+ \S+ \[[^\]]+\] "[A-Z]+ /(wp-login\.php|wp-admin/(?!admin-ajax\.php)\S*) HTTP/\d\.\d" 404

ignoreregex =
